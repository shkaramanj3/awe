<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafe Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Sans+Arabic:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#17306b; --cobalt-2:#244a9a; --saffron:#f2b233; --coffee:#5a3825;
  --paper:#f3f6f4; --card:#ffffff; --ink:#1b1f2a; --muted:#5d6676; --line:#c9d1dc;
  --head:"Fraunces","Noto Kufi Arabic",Georgia,serif;
  --body:"Inter","Noto Sans Arabic",system-ui,sans-serif;
}
:root[lang="ar"],:root[lang="ckb"]{--head:"Noto Kufi Arabic","Noto Sans Arabic",sans-serif;--body:"Noto Sans Arabic","Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.6;font-size:16px}
[lang="ar"] body,[lang="ckb"] body{line-height:1.9}

/* hero */
.hero{
  background:
    conic-gradient(from 45deg at 50% 50%,transparent 0 25%,rgba(255,255,255,.07) 0 50%,transparent 0 75%,rgba(255,255,255,.07) 0) 0 0/44px 44px,
    var(--cobalt);
  color:#fff;padding:28px 20px 56px;border-bottom:6px solid var(--saffron);
}
.wrap{max-width:720px;margin:0 auto}
.langs{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:4px;gap:2px}
.langs button{
  font:inherit;font-size:15px;color:#fff;background:none;border:0;border-radius:999px;
  padding:8px 18px;cursor:pointer;min-height:40px;
}
.langs button[aria-pressed="true"]{background:var(--saffron);color:var(--ink);font-weight:500}
.langs button:focus-visible,.cats a:focus-visible{outline:3px solid #fff;outline-offset:2px}
h1{font-family:var(--head);font-weight:700;font-size:clamp(40px,10vw,68px);line-height:1.15;margin-top:44px}
.tag{margin-top:10px;font-size:18px;color:#dbe4f7;max-width:34ch}
.hours{margin-top:22px;display:inline-block;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 14px;font-size:15px}

/* category nav */
.cats{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;padding:10px 20px;overflow-x:auto}
.cats a{white-space:nowrap;text-decoration:none;color:var(--cobalt);border:1.5px solid var(--cobalt);border-radius:999px;padding:6px 16px;font-size:15px}
.cats a:hover{background:var(--cobalt);color:#fff}

/* menu */
main .wrap{padding:8px 20px 56px}
section{margin-top:40px}
h2{font-family:var(--head);font-weight:700;font-size:28px;color:var(--cobalt);display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;height:3px;background:var(--saffron);border-radius:2px}
.items{list-style:none;padding:0;margin-top:14px;background:var(--card);border-radius:14px;padding:6px 20px;box-shadow:0 1px 0 var(--line)}
.item{padding:14px 0;border-bottom:1px solid #e6eaf0}
.item:last-child{border-bottom:0}
.row{display:flex;align-items:baseline;gap:10px}
.name{font-weight:500;font-size:18px}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.price{font-weight:500;color:var(--coffee);white-space:nowrap}
.desc{color:var(--muted);font-size:14.5px;max-width:52ch}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 40px}

.fade{animation:in .25s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ckb">کوردی</button>
    </div>
    <h1 id="title"></h1>
    <p class="tag" id="tagline"></p>
    <span class="hours" id="hours"></span>
  </div>
</header>

<nav class="cats" aria-label="Categories"><div class="wrap" id="cats"></div></nav>
<main><div class="wrap" id="menu"></div></main>
<footer id="note"></footer>

<script>
// ---------- EDIT HERE: your cafe text, items and prices ----------
const UI = {
  en:{title:"Your Cafe Name",tagline:"Fresh coffee, warm tea and something sweet.",hours:"Open daily 8:00 – 23:00",note:"Prices are in Iraqi dinar (IQD).",cur:"IQD",dir:"ltr"},
  ar:{title:"اسم المقهى",tagline:"قهوة طازجة وشاي دافئ وشيء حلو.",hours:"مفتوح يوميًا ٨:٠٠ – ٢٣:٠٠",note:"الأسعار بالدينار العراقي.",cur:"د.ع",dir:"rtl"},
  ckb:{title:"ناوی کافێکەت",tagline:"قاوەی تازە، چای گەرم و شتێکی شیرین.",hours:"هەموو ڕۆژێک کراوەیە ٨:٠٠ – ٢٣:٠٠",note:"نرخەکان بە دیناری عێراقین.",cur:"دینار",dir:"rtl"}
};

const MENU = [
  {id:"hot", t:{en:"Hot drinks",ar:"المشروبات الساخنة",ckb:"خواردنەوە گەرمەکان"}, items:[
    {p:2500,n:{en:"Espresso",ar:"إسبريسو",ckb:"ئێسپرێسۆ"},d:{en:"Single shot, rich and strong.",ar:"جرعة واحدة غنية وقوية.",ckb:"یەک شۆت، بەهێز و دەوڵەمەند."}},
    {p:3500,n:{en:"Cappuccino",ar:"كابتشينو",ckb:"کاپوچینۆ"},d:{en:"Espresso with steamed milk foam.",ar:"إسبريسو مع رغوة الحليب.",ckb:"ئێسپرێسۆ لەگەڵ کەفی شیر."}},
    {p:3500,n:{en:"Latte",ar:"لاتيه",ckb:"لاتێ"},d:{en:"Smooth espresso with lots of milk.",ar:"إسبريسو ناعم مع الكثير من الحليب.",ckb:"ئێسپرێسۆی نەرم لەگەڵ شیری زۆر."}},
    {p:2000,n:{en:"Turkish coffee",ar:"قهوة تركية",ckb:"قاوەی تورکی"},d:{en:"Served in a small cup, with cardamom.",ar:"تُقدَّم في فنجان صغير مع الهيل.",ckb:"لە فنجانێکی بچووک، لەگەڵ هێل."}},
    {p:2000,n:{en:"Arabic coffee",ar:"قهوة عربية",ckb:"قاوەی عەرەبی"},d:{en:"Light roast with cardamom and saffron.",ar:"تحميص خفيف بالهيل والزعفران.",ckb:"برژاندنی سووک بە هێل و زەعفەران."}},
    {p:1000,n:{en:"Mint tea",ar:"شاي بالنعناع",ckb:"چای نەعنا"},d:{en:"Black tea with fresh mint.",ar:"شاي أسود مع نعناع طازج.",ckb:"چای ڕەش لەگەڵ نەعنای تازە."}}
  ]},
  {id:"cold", t:{en:"Cold drinks",ar:"المشروبات الباردة",ckb:"خواردنەوە سارەکان"}, items:[
    {p:4000,n:{en:"Iced coffee",ar:"قهوة مثلجة",ckb:"قاوەی سارد"},d:{en:"Espresso over ice with milk.",ar:"إسبريسو على الثلج مع الحليب.",ckb:"ئێسپرێسۆی سارد لەگەڵ شیر."}},
    {p:3500,n:{en:"Fresh orange juice",ar:"عصير برتقال طازج",ckb:"ئاوی پرتەقاڵی تازە"},d:{en:"Squeezed when you order.",ar:"يُعصر عند الطلب.",ckb:"کاتی داواکردن دەگوشرێت."}},
    {p:3000,n:{en:"Lemonade",ar:"ليموناضة",ckb:"لیمۆناد"},d:{en:"Lemon, mint and a little sugar.",ar:"ليمون ونعناع وقليل من السكر.",ckb:"لیمۆ، نەعنا و کەمێک شەکر."}}
  ]},
  {id:"sweet", t:{en:"Sweets",ar:"الحلويات",ckb:"شیرینی"}, items:[
    {p:3000,n:{en:"Croissant",ar:"كرواسون",ckb:"کرواسان"},d:{en:"Buttery, baked every morning.",ar:"بالزبدة، يُخبز كل صباح.",ckb:"بە کەرە، هەموو بەیانییەک دەکرێتە فڕن."}},
    {p:4000,n:{en:"Baklava",ar:"بقلاوة",ckb:"بەقلاوە"},d:{en:"Layered pastry with pistachio and syrup.",ar:"عجينة طبقات بالفستق والقطر.",ckb:"هەویری چین چین بە فستق و شەربەت."}},
    {p:5000,n:{en:"Kunafa",ar:"كنافة",ckb:"کونافە"},d:{en:"Warm cheese kunafa with syrup.",ar:"كنافة بالجبن دافئة مع القطر.",ckb:"کونافەی پەنیر گەرم لەگەڵ شەربەت."}},
    {p:4500,n:{en:"Cheesecake",ar:"تشيز كيك",ckb:"چیزکەیک"},d:{en:"Creamy, with a biscuit base.",ar:"كريمي مع قاعدة بسكويت.",ckb:"کرێمی، لەسەر بنکەی بسکویت."}}
  ]}
];
// ------------------------------------------------------------------

const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
const num = (n, lang) => {
  const s = n.toLocaleString("en-US");
  return lang === "en" ? s : s.replace(/\d/g, d => AR_DIGITS[d]).replace(",", "٬");
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function readLang(){
  const fromHash = location.hash.replace("#","");
  if (UI[fromHash]) return fromHash;
  try { const s = localStorage.getItem("menu-lang"); if (UI[s]) return s; } catch(e){}
  return "en";
}

function render(lang, animate){
  const u = UI[lang];
  const root = document.documentElement;
  root.lang = lang; root.dir = u.dir;
  document.title = u.title;
  document.getElementById("title").textContent = u.title;
  document.getElementById("tagline").textContent = u.tagline;
  document.getElementById("hours").textContent = u.hours;
  document.getElementById("note").textContent = u.note;

  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang));

  document.getElementById("cats").innerHTML =
    MENU.map(c => `<a href="#${c.id}">${esc(c.t[lang])}</a>`).join("");

  document.getElementById("menu").innerHTML = MENU.map(c => `
    <section id="${c.id}">
      <h2>${esc(c.t[lang])}</h2>
      <ul class="items">${c.items.map(i => `
        <li class="item">
          <div class="row">
            <span class="name">${esc(i.n[lang])}</span>
            <span class="dots" aria-hidden="true"></span>
            <span class="price">${num(i.p, lang)} ${esc(u.cur)}</span>
          </div>
          <p class="desc">${esc(i.d[lang])}</p>
        </li>`).join("")}
      </ul>
    </section>`).join("");

  if (animate){
    const m = document.getElementById("menu");
    m.classList.remove("fade"); void m.offsetWidth; m.classList.add("fade");
  }
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  const lang = b.dataset.lang;
  render(lang, true);
  try { localStorage.setItem("menu-lang", lang); } catch(e){}
  try { history.replaceState(null, "", "#" + lang); } catch(e){}
}));

window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#","");
  if (UI[h]) render(h, true);
});

render(readLang(), false);
</script>
</body>
</html>
